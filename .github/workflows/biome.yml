name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 钉死版本：必须和 package.json 里 @biomejs/biome 的版本一致
      # 用 latest 会让 CI 在无人改代码的情况下突然变红（新版格式化规则不同）
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.4

      - name: Run Biome
        run: biome ci ./src --reporter=github
